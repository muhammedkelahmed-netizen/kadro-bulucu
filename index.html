<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10343a">
<title>Kadro Bulucu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Kadro Bulucu — sakin, güven veren kamu hissi: koyu petrol/mürekkep, kâğıt zemin.
   Tek sütun, telefon öncelikli; geniş ekranda kartlar iki sütun. */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --surface-2: #e9efed; --ink: #15232a; --muted: #55666c; --line: #d3dcda;
  --accent: #0f5e63; --accent-ink: #ffffff; --accent-soft: #dcecea; --head: #10343a; --head-ink: #eef6f5; --head-muted: #a9c6c4;
  --ok: #1f7a4d; --ok-bg: #e2f2e8; --near: #8a5a00; --near-bg: #fbf0d6; --far: #a8332b; --far-bg: #f8e3e0;
  --info-bg: #e6eef6; --info-ink: #284a6b; --focus: #2b7fd1; --veil: rgba(12, 24, 28, .5);
  --font: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 12px; --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1719; --surface: #172226; --surface-2: #1e2c31; --ink: #e4eeee; --muted: #9db1b3; --line: #2c3d42;
    --accent: #5cc2bd; --accent-ink: #062022; --accent-soft: #19393b; --head: #0b2428; --head-ink: #e6f3f2; --head-muted: #8fb4b2;
    --ok: #6fd39c; --ok-bg: #163527; --near: #f0c060; --near-bg: #3a2e12; --far: #f08a80; --far-bg: #3d1d1a;
    --info-bg: #1b2a3a; --info-ink: #a9c8e8; --focus: #7ab8ff; --veil: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1719; --surface: #172226; --surface-2: #1e2c31; --ink: #e4eeee; --muted: #9db1b3; --line: #2c3d42;
  --accent: #5cc2bd; --accent-ink: #062022; --accent-soft: #19393b; --head: #0b2428; --head-ink: #e6f3f2; --head-muted: #8fb4b2;
  --ok: #6fd39c; --ok-bg: #163527; --near: #f0c060; --near-bg: #3a2e12; --far: #f08a80; --far-bg: #3d1d1a;
  --info-bg: #1b2a3a; --info-ink: #a9c8e8; --focus: #7ab8ff; --veil: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.5; overflow-x: hidden;
}
body.modal-open { overflow: hidden; }
#app { min-height: 100vh; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { line-height: 1.25; margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

/* Üst bar + sekmeler */
.topbar { background: var(--head); color: var(--head-ink); position: sticky; top: 0; z-index: 20; box-shadow: 0 1px 0 rgba(0,0,0,.15); }
.topbar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; padding-bottom: 6px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; flex: none; background:
  linear-gradient(135deg, transparent 0 46%, var(--head) 46% 54%, transparent 54%), linear-gradient(160deg, #6fd0c8, #2c8c8a); }
.brand-name { margin: 0; font-weight: 700; font-size: 18px; letter-spacing: .01em; }
.brand-sub { margin: 0; font-size: 13px; color: var(--head-muted); }
.topbar .btn-ghost { color: var(--head-ink); border-color: rgba(255,255,255,.25); background: transparent; }
.tabbar { display: flex; gap: 4px; }
.tabbar button {
  flex: 1 1 0; min-width: 0; background: none; border: 0; color: var(--head-muted); padding: 10px 6px 11px;
  font-weight: 600; font-size: 15px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap;
}
.tabbar button[aria-selected="true"] { color: var(--head-ink); border-bottom-color: #6fd0c8; }
main.wrap { padding-top: 16px; padding-bottom: 40px; }

/* Düğmeler */
.btn, .btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px;
  border-radius: 10px; font-weight: 600; cursor: pointer; text-decoration: none; border: 1px solid transparent;
}
.btn { background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.06); }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--accent); }
.small { min-height: 36px; padding: 5px 12px; font-size: 14px; }
.danger.btn { background: var(--far); color: #fff; }
.btn-ghost.danger { color: var(--far); }
.btn-link { background: none; border: 0; color: var(--accent); padding: 6px 0; cursor: pointer; text-decoration: underline; font-size: 14px; }
.btn-x { background: none; border: 0; font-size: 26px; line-height: 1; width: 40px; height: 40px; cursor: pointer; color: var(--muted); border-radius: 8px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; white-space: nowrap; }

/* Puan paneli */
.score-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 12px; }
.score-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.score-label { font-weight: 700; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.score-input-row { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.score-in {
  width: 128px; flex: none; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 4px 10px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
}
.score-in.invalid { border-color: var(--far); }
input[type="range"] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); height: 32px; }
.help { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.caveat { margin: 10px 0 0; font-size: 14px; color: var(--info-ink); background: var(--info-bg); border-radius: 8px; padding: 8px 10px; }

/* Özet */
.summary { margin: 14px 0; }
.sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sum-cell { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; min-width: 0; }
.sum-cell:last-child { grid-column: 1 / -1; }
.sum-n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.sum-l { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
.sum-cell.good { background: var(--ok-bg); border-color: transparent; } .sum-cell.good .sum-n { color: var(--ok); }
.sum-cell.warn { background: var(--near-bg); border-color: transparent; } .sum-cell.warn .sum-n { color: var(--near); }
.sum-empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; margin: 0; }

/* Filtreler */
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 16px 10px; margin-bottom: 14px; }
.filters > summary { cursor: pointer; font-weight: 700; padding: 10px 0; list-style-position: inside; }
.f-block { margin: 6px 0 12px; }
.f-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.f-title { display: block; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.muted { opacity: .45; }
.chip-wrap { display: inline-flex; align-items: center; }
.chip {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 6px 12px; min-height: 36px;
  font-size: 14px; cursor: pointer; max-width: 100%;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip-x { border: 0; background: none; color: var(--muted); font-size: 20px; width: 30px; height: 36px; cursor: pointer; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 6px; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.add-il { margin-top: 8px; }
select, input:not([type]), input[type="search"], input[type="text"], input[type="url"], input[type="date"], textarea {
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); padding: 8px 10px; min-height: 40px; max-width: 100%;
}
.f-row { display: flex; gap: 10px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; min-width: 0; }
.field > span { font-weight: 600; color: var(--muted); font-size: 13px; }
.field.grow { flex: 1 1 200px; }
.field input, .field select, .field textarea { width: 100%; }

/* Sonuç kartları */
.results { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 820px) { .results { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.card.lvl-ok { border-left-color: var(--ok); } .card.lvl-near { border-left-color: var(--near); } .card.lvl-far { border-left-color: var(--far); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.kurum { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.cat { flex: none; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; max-width: 45%; text-align: right; }
.meta { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.unvan { margin: 6px 0 0; font-weight: 600; color: var(--accent); }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 10px 0 0; }
.nums div { min-width: 0; }
.nums dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.nums dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; overflow-wrap: anywhere; }
.nums dd.big { font-size: 19px; font-weight: 700; }
.status { margin: 10px 0 0; padding: 7px 10px; border-radius: 8px; font-size: 15px; }
.status.ok { background: var(--ok-bg); color: var(--ok); } .status.near { background: var(--near-bg); color: var(--near); }
.status.far { background: var(--far-bg); color: var(--far); } .status.none { background: var(--surface-2); color: var(--muted); }
.st-ctx { display: block; font-size: 12.5px; opacity: .85; }
.trend { list-style: none; display: flex; gap: 4px; padding: 0; margin: 10px 0 0; }
.tr-cell { flex: 1 1 0; min-width: 0; background: var(--surface-2); border-radius: 6px; padding: 3px 4px; text-align: center; }
.tr-cell.cur { outline: 2px solid var(--accent); outline-offset: -2px; }
.tr-cell.empty { opacity: .55; }
.tr-p { display: block; font-size: 11px; color: var(--muted); }
.tr-v { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tr-a { margin-left: 1px; font-size: 12px; } .tr-a.down { color: var(--ok); } .tr-a.up { color: var(--far); }
.flags { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; }
.flag { font-size: 13.5px; padding-left: 18px; position: relative; color: var(--ink); }
.flag::before { content: ""; position: absolute; left: 3px; top: .5em; width: 8px; height: 8px; border-radius: 2px; background: var(--near); }
.flag.bolum::before { background: var(--muted); } .flag.bilgi::before { background: var(--info-ink); border-radius: 50%; }
.kv { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); }
.kv > span:not(.sep) { font-weight: 600; } .kv .sep { margin: 0 4px; }
.card-actions { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.rows { font-size: 14px; flex: 1 1 200px; min-width: 0; }
.rows summary { cursor: pointer; color: var(--accent); padding: 6px 0; }
.tbl-wrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
.more-wrap { text-align: center; margin: 16px 0; }
.foot { font-size: 13px; color: var(--muted); margin-top: 20px; overflow-wrap: anywhere; }

/* Yol haritası */
.intro { margin-bottom: 14px; }
.intro h1 { font-size: 26px; margin-bottom: 6px; }
.intro p { margin: 0 0 6px; color: var(--muted); }
.intro .date { font-size: 13px; }
.intro-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.road { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; }
.kicker { margin: 0 0 2px; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.road h2 { font-size: 19px; }
.lede { margin: 6px 0 4px; font-weight: 600; }
.road ul { margin: 6px 0 0; padding-left: 20px; }
.road li { margin: 5px 0; }
.src { margin: 10px 0 0; font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
.src > span { font-weight: 600; }
.tag-teyit { display: inline-block; font-size: 12px; font-weight: 700; color: var(--near); background: var(--near-bg); border-radius: 6px; padding: 0 6px; white-space: nowrap; }

/* İlan takibi */
.warnbox { background: var(--near-bg); color: var(--near); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.ilan-list { display: grid; gap: 10px; }
@media (min-width: 820px) { .ilan-list { grid-template-columns: 1fr 1fr; } }
.ilan { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.ilan.dl-past { opacity: .72; border-style: dashed; }
.ilan.closed { opacity: .8; }
.ilan-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.ilan h3 { font-size: 17px; overflow-wrap: anywhere; }
.badge { flex: none; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.dl-soon, .badge.dl-today { background: var(--near-bg); color: var(--near); }
.badge.dl-later { background: var(--ok-bg); color: var(--ok); }
.badge.dl-past { background: var(--far-bg); color: var(--far); text-decoration: none; }
.ilan-kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 8px 0 0; }
.ilan-kv dt { font-size: 12px; color: var(--muted); }
.ilan-kv dd { margin: 0; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.ilan-not { margin: 8px 0 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ilan-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.durum { min-height: 36px; padding: 4px 8px; font-size: 14px; }
.empty-state { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; }
.empty-state h2 { font-size: 18px; margin-bottom: 6px; }
.empty-state p { margin: 0; color: var(--muted); }
.sec-h { font-size: 17px; margin: 22px 0 10px; }
.sites { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
@media (min-width: 820px) { .sites { grid-template-columns: 1fr 1fr; } }
.site { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-decoration: none; color: var(--ink); min-height: 44px; }
.site:hover { border-color: var(--accent); }
.site-l { font-weight: 700; color: var(--accent); }
.site-l::after { content: " ↗"; font-weight: 400; }
.site-n { font-size: 13.5px; color: var(--muted); }

/* Diyalog */
#modal-root { display: none; }
#modal-root.on { display: block; position: fixed; inset: 0; z-index: 50; }
.veil { position: absolute; inset: 0; background: var(--veil); }
.modal {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 24px));
  max-height: calc(100% - 24px); display: flex; flex-direction: column; background: var(--surface); color: var(--ink);
  border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.3);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 4px 16px; }
.modal-head h2 { font-size: 18px; }
.modal-body { padding: 4px 16px 8px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 14px; flex-wrap: wrap; border-top: 1px solid var(--line); }
.form { display: grid; gap: 10px; }
.f-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-err { color: var(--far); font-size: 14px; margin: 0; min-height: 1em; }
.io h3 { font-size: 15px; margin: 10px 0 2px; }
.io textarea { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; margin: 6px 0; }
#toast {
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); background: var(--head); color: var(--head-ink);
  padding: 10px 16px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60;
  max-width: calc(100% - 32px);
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 380px) {
  .nums { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .f-2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Güncel ilanlar */
.badge.u-ok { background: var(--ok-bg); color: var(--ok); }
.badge.u-near { background: var(--near-bg); color: var(--near); }
.badge.u-far { background: var(--far-bg); color: var(--far); }
.g-card { border-left: 5px solid var(--line); }
.g-card.u-ok { border-left-color: var(--ok); }
.g-card.u-near { border-left-color: var(--near); }
.g-uyg { margin: 8px 0 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.g-filter { margin: 0 0 12px; }
.g-card .ilan-kv { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 8px; }
.btn.small { padding: 6px 12px; font-size: 14px; min-height: 36px; }
.new-tag { display: inline-block; vertical-align: 2px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--accent-ink); background: var(--accent); border-radius: 6px; padding: 1px 6px; }

</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <h2>${esc(c.title)}</h2>
        <p class="lede">${esc(c.lede)}</p>
        <ul>${c.items.map((i) => `<li>${esc(i.t)}${i.teyit ? ` <span class="tag-teyit">teyit edilmeli</span>` : ""}</li>`).join("")}</ul>
        <p class="src"><span>Kaynak:</span> ${c.sources.map((s) => `<a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(" · ")}</p>
      </article>`).join("")}`;
}

// ---------- İlan Takibi ----------
function sitesHtml() {
  return `<ul class="sites">${ILAN_SITES.map((s) => `<li><a class="site" href="${s.url}" target="_blank" rel="noopener"><span class="site-l">${esc(s.label)}</span><span class="site-n">${esc(s.note)}</span></a></li>`).join("")}</ul>`;
}

// ---------- Güncel İlanlar (bot tarafından derlenir, sayfaya gömülür) ----------
const SHARED = tracker.loadSharedIlanlar();
const UYG_LABEL = { "uygun": "Uygun", "şartlı": "Şartlı uygun", "uygun değil": "Uygun değil" };
const UYG_CLASS = { "uygun": "u-ok", "şartlı": "u-near", "uygun değil": "u-far" };
let guncelFilter = "hepsi";

function guncelCard(i, today) {
  const dl = tracker.daysLeft(i, today);
  const tracked = state.ilanlar.some((x) => x.id === `g-${i.id}`);
  const yer = [i.il, i.ilce].filter(Boolean).map(esc).join(" / ");
  return `<article class="ilan g-card ${UYG_CLASS[i.uygunluk]}" data-gid="${esc(i.id)}">
    <div class="ilan-top">
      <h3>${tracker.isNew(i, today) ? `<span class="new-tag">YENİ</span> ` : ""}${esc(i.kurum)}</h3>
      <span class="badge dl-${dl.kind}">${esc(dl.text)}</span>
    </div>
    <p class="meta">${[yer, esc(i.unvan)].filter(Boolean).join(" · ") || "&nbsp;"}</p>
    <p class="g-uyg"><span class="badge ${UYG_CLASS[i.uygunluk]}">${UYG_LABEL[i.uygunluk]}</span> ${esc(i.uygunlukNeden)}</p>
    <dl class="ilan-kv">
      <div><dt>Statü</dt><dd>${i.statu === "?" ? "Belirsiz" : i.statu === "4/A" ? "4/A kadro" : "4/B sözleşmeli"}</dd></div>
      <div><dt>Puan şartı</dt><dd>${esc(i.puanSarti) || "—"}</dd></div>
      <div><dt>Kontenjan</dt><dd>${i.kontenjan ?? "—"}</dd></div>
      <div><dt>Başvuru</dt><dd>${i.basvuruBaslangic ? esc(fmtDate(i.basvuruBaslangic)) : "—"}</dd></div>
      <div><dt>Son başvuru</dt><dd>${i.sonBasvuru ? esc(fmtDate(i.sonBasvuru)) : "—"}</dd></div>
      <div><dt>Kaynak</dt><dd>${i.kaynakTuru === "resmi" ? "Resmî ilan" : "Haber"}</dd></div>
    </dl>
    ${i.ogrenim ? `<p class="ilan-not"><b>Öğrenim:</b> ${esc(i.ogrenim)}</p>` : ""}
    ${i.notlar ? `<p class="ilan-not">${esc(i.notlar)}</p>` : ""}
    <div class="ilan-actions">
      ${i.link ? `<a class="btn-ghost small" href="${esc(i.link)}" target="_blank" rel="noopener">İlanı aç</a>` : ""}
      ${tracked ? `<span class="pill">Takibinde ✓</span>` : `<button type="button" class="btn small" data-gtrack="${esc(i.id)}">Takibime ekle</button>`}
    </div>
  </article>`;
}

function renderGuncel() {
  const p = $("#p-guncel");
  const today = isoDay();
  const aktif = SHARED.ilanlar.filter((i) => tracker.daysLeft(i, today).kind !== "past" && i.uygunluk !== "uygun değil");
  const list = tracker.sortIlanlar(aktif.filter((i) => guncelFilter === "hepsi" || i.uygunluk === guncelFilter), today);
  const n = (u) => aktif.filter((i) => i.uygunluk === u).length;
  p.innerHTML = `
    <div class="intro">
      <h1>Güncel İlanlar</h1>
      <p>İstanbul ve çevresinde, ön lisans mezununun KPSS P93 ile başvurabileceği kamu ilanları. Liste her sabah otomatik taranır; son 3 günde eklenenler “YENİ” etiketiyle görünür.</p>
      <p class="date">${SHARED.guncelleme ? `Son tarama: <b>${esc(fmtDate(SHARED.guncelleme))}</b> · ${aktif.length} açık ilan` : "Henüz derlenmiş ilan yok."}</p>
      ${(() => {
        const s = tracker.staleDays(SHARED.guncelleme, today);
        return s !== null && s > 2
          ? `<p class="warnbox" id="stale-warn"><b>Dikkat:</b> Bu liste ${s} gündür güncellenmedi. Otomatik tarama aksamış olabilir; bu arada aşağıdaki resmî sitelere de bak ve durumu ilet.</p>`
          : "";
      })()}
      ${SHARED.not ? `<p class="caveat">${esc(SHARED.not)}</p>` : ""}
      <p class="caveat">Başvurmadan önce mutlaka resmî ilan metnini oku: yaş, sertifika, ehliyet ve sınav usulü ilandan ilana değişir. “Uygun” etiketi senin puanına ve mezuniyetine göre ön değerlendirmedir.</p>
    </div>
    ${aktif.length ? `<div class="chips g-filter" role="group" aria-label="Uygunluk">
      ${[["hepsi", `Hepsi (${aktif.length})`], ["uygun", `Uygun (${n("uygun")})`], ["şartlı", `Şartlı (${n("şartlı")})`]]
        .map(([k, l]) => `<button type="button" class="chip${guncelFilter === k ? " on" : ""}" data-gf="${k}" aria-pressed="${guncelFilter === k}">${l}</button>`).join("")}
    </div>` : ""}
    ${list.length ? `<div class="ilan-list">${list.map((i) => guncelCard(i, today)).join("")}</div>` : `
      <div class="empty-state"><h2>Şu an listede açık ilan yok</h2><p>Yeni ilanlar eklendikçe burada görünecek. Bu arada “Takibim” sekmesindeki resmî sitelere de bakabilirsin.</p></div>`}`;
  p.querySelectorAll("[data-gf]").forEach((b) => b.addEventListener("click", () => { guncelFilter = b.dataset.gf; renderGuncel(); }));
  p.querySelectorAll("[data-gtrack]").forEach((b) => b.addEventListener("click", () => {
    const s = SHARED.ilanlar.find((x) => x.id === b.dataset.gtrack);
    if (!s || state.ilanlar.some((x) => x.id === `g-${s.id}`)) return;
    state.ilanlar.push(tracker.sharedToTracked(s));
    persist(); renderGuncel(); toast("Takibine eklendi");
  }));
}

function ilanCard(i, today, readOnly = false) {
  const dl = tracker.daysLeft(i, today);
  return `<article class="ilan dl-${dl.kind}${i.durum === "Uygun değil" || i.durum === "Sonuçlandı" ? " closed" : ""}" data-id="${esc(i.id)}">
    <div class="ilan-top">
      <h3>${esc(i.kurum)}</h3>
      <span class="badge dl-${dl.kind}">${esc(dl.text)}</span>
    </div>
    <p class="meta">${[i.il, i.unvan].filter(Boolean).map(esc).join(" · ") || "&nbsp;"}</p>
    <dl class="ilan-kv">
      <div><dt>Statü</dt><dd>${i.statu === "?" ? "Bilinmiyor" : esc(i.statu)}</dd></div>
      <div><dt>Puan şartı</dt><dd>${esc(i.puanSarti) || "—"}</dd></div>
      <div><dt>Son başvuru</dt><dd>${i.sonBasvuru ? esc(fmtDate(i.sonBasvuru)) : "—"}</dd></div>
    </dl>
    ${i.not ? `<p class="ilan-not">${esc(i.not)}</p>` : ""}
    <div class="ilan-actions">
      ${readOnly ? `<span class="pill">Paylaşılan</span>` : `<label class="sr" for="d-${esc(i.id)}">Durum</label>
      <select class="durum" id="d-${esc(i.id)}" data-durum="${esc(i.id)}">${tracker.DURUMLAR.map((d) => `<option${d === i.durum ? " selected" : ""}>${d}</option>`).join("")}</select>`}
      ${i.link ? `<a class="btn-ghost small" href="${esc(i.link)}" target="_blank" rel="noopener">İlanı aç</a>` : ""}
      ${readOnly ? "" : `<button type="button" class="btn-ghost small" data-edit="${esc(i.id)}">Düzenle</button>
      <button type="button" class="btn-ghost small danger" data-del="${esc(i.id)}">Sil</button>`}
    </div>
  </article>`;
}

function renderIlan() {
  const p = $("#p-ilan");
  const today = isoDay();
  const list = tracker.sortIlanlar(state.ilanlar, today);
  p.innerHTML = `
    <div class="intro">
      <h1>Takibim</h1>
      <p>Başvurmayı düşündüğün ilanları buraya ekle; son başvuru tarihine göre sıralanır. Kayıtlar yalnızca bu tarayıcıda tutulur.</p>
      <div class="intro-actions">
        <button type="button" class="btn" id="ilan-add">İlan ekle</button>
        <button type="button" class="btn-ghost" id="ilan-io">Yedekle / geri yükle</button>
      </div>
      ${saveOk ? "" : `<p class="warnbox">Bu tarayıcı kalıcı kayda izin vermiyor; sayfa kapanınca liste silinebilir. “Yedekle” ile metni kopyalayıp sakla.</p>`}
    </div>
    ${list.length ? `<div class="ilan-list" id="ilan-list">${list.map((i) => ilanCard(i, today)).join("")}</div>` : `
      <div class="empty-state" id="ilan-empty">
        <h2>Henüz ilan eklemedin</h2>
        <p>Uygun bir ilan gördüğünde “İlan ekle” ile kaydet: kurum, statü (4/A kadro mu, 4/B sözleşmeli mi), puan şartı ve son başvuru tarihi. Aşağıdaki resmi sitelerde “memur”, “büro personeli” ve il adıyla arama yapabilirsin. Belediye ilanlarında asgari P93 puanına ve kaç kat adayın sözlüye çağrıldığına dikkat et.</p>
      </div>`}
    <h2 class="sec-h">Nerelere bakmalı?</h2>
    ${sitesHtml()}`;
  $("#ilan-add").addEventListener("click", () => openIlanForm(null));
  $("#ilan-io").addEventListener("click", openIO);
  p.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openIlanForm(state.ilanlar.find((x) => x.id === b.dataset.edit))));
  p.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => confirmDelete(b.dataset.del)));
  p.querySelectorAll("[data-durum]").forEach((s) => s.addEventListener("change", () => {
    const i = state.ilanlar.find((x) => x.id === s.dataset.durum);
    if (i) { i.durum = s.value; i.guncelleme = new Date().toISOString(); persist(); renderIlan(); toast("Durum güncellendi"); }
  }));
}

// ---------- Diyaloglar ----------
let lastFocus = null;
function openModal({ title, body, actions, onOpen }) {
  lastFocus = document.activeElement;
  const root = $("#modal-root");
  root.innerHTML = `<div class="veil" data-close></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <div class="modal-head"><h2 id="m-title">${esc(title)}</h2><button type="button" class="btn-x" data-close aria-label="Kapat">×</button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">${actions.map((a, k) => `<button type="button" class="${a.kind || "btn"}" data-act="${k}">${esc(a.label)}</button>`).join("")}</div>
    </div>`;
  root.classList.add("on");
  document.body.classList.add("modal-open");
  root.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", closeModal));
  root.querySelectorAll("[data-act]").forEach((el) => el.addEventListener("click", () => actions[+el.dataset.act].onClick()));
  root.addEventListener("keydown", modalKeys);
  if (onOpen) onOpen(root);
  const first = root.querySelector("input, select, textarea, button:not([data-close])");
  if (first) first.focus();
}
function modalKeys(e) {
  const root = $("#modal-root");
  if (e.key === "Escape") { e.preventDefault(); closeModal(); return; }
  if (e.key !== "Tab") return;
  const f = [...root.querySelectorAll("button, input, select, textarea, a[href]")].filter((x) => !x.disabled && x.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
}
function closeModal() {
  const root = $("#modal-root");
  root.removeEventListener("keydown", modalKeys);
  root.classList.remove("on");
  root.innerHTML = "";
  document.body.classList.remove("modal-open");
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

function openIlanForm(existing, prefill = {}) {
  const i = existing || { statu: "?", durum: "İnceleniyor", ...prefill };
  const opt = (arr, cur) => arr.map((x) => `<option${x === cur ? " selected" : ""}>${esc(x)}</option>`).join("");
  openModal({
    title: existing ? "İlanı düzenle" : "İlan ekle",
    body: `<form id="ilan-form" class="form" novalidate>
      <label class="field"><span>Kurum *</span><input name="kurum" required maxlength="200" value="${esc(i.kurum)}" placeholder="ör. Şile Belediyesi"></label>
      <div class="f-2">
        <label class="field"><span>İl</span><input name="il" list="dl-il" maxlength="60" value="${esc(i.il)}"></label>
        <label class="field"><span>Statü</span><select name="statu">
          <option value="4/A"${i.statu === "4/A" ? " selected" : ""}>4/A kadro</option>
          <option value="4/B"${i.statu === "4/B" ? " selected" : ""}>4/B sözleşmeli</option>
          <option value="?"${i.statu === "?" ? " selected" : ""}>Bilinmiyor</option></select></label>
      </div>
      <label class="field"><span>Ünvan</span><input name="unvan" list="dl-unvan" maxlength="120" value="${esc(i.unvan)}" placeholder="ör. Memur, Büro Personeli"></label>
      <div class="f-2">
        <label class="field"><span>Puan şartı</span><input name="puanSarti" maxlength="60" value="${esc(i.puanSarti)}" placeholder="ör. P93 ≥ 60"></label>
        <label class="field"><span>Son başvuru</span><input name="sonBasvuru" type="date" value="${esc(i.sonBasvuru)}"></label>
      </div>
      <label class="field"><span>Bağlantı</span><input name="link" type="url" inputmode="url" maxlength="600" value="${esc(i.link)}" placeholder="https://"></label>
      <label class="field"><span>Durum</span><select name="durum">${opt(tracker.DURUMLAR, i.durum)}</select></label>
      <label class="field"><span>Not</span><textarea name="not" rows="3" maxlength="2000">${esc(i.not)}</textarea></label>
      <p class="form-err" id="form-err" role="alert"></p>
      <datalist id="dl-il">${ALL_ILS.map((x) => `<option value="${esc(trTitle(x))}">`).join("")}</datalist>
      <datalist id="dl-unvan">${UNVANLAR.map((x) => `<option value="${esc(trTitle(x))}">`).join("")}</datalist>
    </form>`,
    actions: [
      { label: "Vazgeç", kind: "btn-ghost", onClick: closeModal },
      { label: existing ? "Kaydet" : "Ekle", kind: "btn", onClick: () => submitIlan(existing) },
    ],
    onOpen: (root) => {
      const form = root.querySelector("#ilan-form");
      form.addEventListener("submit", (e) => { e.preventDefault(); submitIlan(existing); });
      form.addEventListener("input", () => { root.querySelector("#form-err").textContent = ""; });
    },
  });
}

function submitIlan(existing) {
  const form = $("#ilan-form");
  const data = Object.fromEntries(new FormData(form).entries());
  const err = $("#form-err");
  if (data.link && !/^https?:\/\//i.test(data.link.trim())) { err.textContent = "Bağlantı http:// veya https:// ile başlamalı."; return; }
  try {
    const rec = tracker.normalizeIlan({ ...(existing || {}), ...data });
    if (existing) state.ilanlar = state.ilanlar.map((x) => (x.id === existing.id ? rec : x));
    else state.ilanlar.push(rec);
    persist();
    closeModal();
    if (tab !== "ilan") setTab("ilan"); else renderIlan();
    toast(existing ? "İlan güncellendi" : "İlan eklendi");
  } catch (e) {
    err.textContent = e.message;
    form.querySelector("[name=kurum]").focus();
  }
}

function confirmDelete(id) {
  const i = state.ilanlar.find((x) => x.id === id);
  if (!i) return;
  openModal({
    title: "İlan silinsin mi?",
    body: `<p><b>${esc(i.kurum)}</b>${i.unvan ? ` · ${esc(i.unvan)}` : ""} takip listesinden kaldırılacak. Bu işlem geri alınamaz.</p>`,
    actions: [
      { label: "Vazgeç", kind: "btn-ghost", onClick: closeModal },
      { label: "Sil", kind: "btn danger", onClick: () => { state.ilanlar = state.ilanlar.filter((x) => x.id !== id); persist(); closeModal(); renderIlan(); toast("İlan silindi"); } },
    ],
  });
}

async function copyText(ta) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(ta.value); return true; }
  } catch { /* yedek yönteme geç */ }
  try {
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    return document.execCommand("copy");
  } catch { return false; }
}

function openIO() {
  const text = tracker.exportText(state.ilanlar);
  openModal({
    title: "Yedekle / geri yükle",
    body: `<div class="io">
      <h3>Yedekle</h3>
      <p class="help">Dosya indirme bu sayfada kapalı. Metni kopyalayıp not uygulamasına ya da kendine mesaj olarak sakla.</p>
      <textarea id="io-out" rows="6" readonly>${esc(text)}</textarea>
      <button type="button" class="btn-ghost small" id="io-copy">Metni kopyala</button> <span class="help" id="io-copy-msg"></span>
      <h3>Geri yükle</h3>
      <p class="help">Daha önce kopyaladığın yedek metnini yapıştır.</p>
      <textarea id="io-in" rows="5" placeholder='{"app":"kadro-bulucu", ...}'></textarea>
      <p class="form-err" id="io-err" role="alert"></p>
    </div>`,
    actions: [
      { label: "Kapat", kind: "btn-ghost", onClick: closeModal },
      { label: "Listeyi değiştir", kind: "btn-ghost", onClick: () => doImport("replace") },
      { label: "Listeye ekle", kind: "btn", onClick: () => doImport("merge") },
    ],
    onOpen: (root) => {
      root.querySelector("#io-copy").addEventListener("click", async () => {
        const ok = await copyText(root.querySelector("#io-out"));
        root.querySelector("#io-copy-msg").textContent = ok ? "Kopyalandı." : "Kopyalanamadı; metin seçili, elle kopyala (Ctrl+C / uzun bas).";
        if (!ok) { const ta = root.querySelector("#io-out"); ta.focus(); ta.select(); }
      });
    },
  });
}

function doImport(mode) {
  const err = $("#io-err");
  try {
    const { ilanlar, skipped } = tracker.parseImport($("#io-in").value);
    if (!ilanlar.length) { err.textContent = "Yedekte geçerli ilan bulunamadı."; return; }
    state.ilanlar = mode === "replace" ? ilanlar : tracker.mergeIlanlar(state.ilanlar, ilanlar);
    persist();
    closeModal();
    renderIlan();
    toast(`${ilanlar.length} ilan yüklendi${skipped ? `, ${skipped} kayıt atlandı` : ""}`);
  } catch (e) {
    err.textContent = e.message;
  }
}

// ---------- Başlat ----------
shell();
window.__kb = { applyFilters, GROUPS, get state() { return state; }, get F() { return F; } };

return {  };
})();
})();</script>
